# Pins the Rust toolchain for this repo. rustup reads this automatically.
# Project MSRV is 1.88 (edition 2024 itself only needs 1.85; the floor is
# driven by transitive deps — wasip2 requires 1.87 — plus let-chains). Dev
# builds on the same version so MSRV violations surface locally; CI's
# `stable` jobs cover the other end.
[toolchain]
channel = "1.88.0"
components = ["rustfmt", "clippy"]
# thumbv7em-none-eabihf: no-std proof target for raylib-sys (check.yml `no-std` job)
targets = ["wasm32-unknown-emscripten", "thumbv7em-none-eabihf"]
