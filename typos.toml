[files]
extend-exclude = [
    "target/*",
    "raylib-sys/raylib/*",
    "raylib-sys/binding/*",
    "docs/*",
    "showcase/*",
    "*/*.png",
    "*/*.fs",
]

# Match Inside a Word - Case Insensitive
[default.extend-words]
ease = "ease"
easer = "easer"
# `mis` appears as a token boundary in valid hyphenated English ("mis-wire",
# "mis-routing") that typos splits on the hyphen. Allow the prefix through.
mis = "mis"

[type.fs]
extend-glob = ["*.fs"]
check-file = false


[type.png]
extend-glob = ["*.png"]
check-file = false
