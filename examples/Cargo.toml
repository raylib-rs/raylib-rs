[package]
name = "raylib-examples"
version = "5.6"
authors = ["raylib-rs team <https://github.com/raylib-rs/raylib-rs>"]
edition = "2021"
license = "Zlib"
readme = "../README.md"
repository = "https://github.com/brettchalupa/sola-raylib"

[dependencies]
raylib = { path = "../raylib", version = "5.6" }
structopt = "0.2"
specs-derive = "0.4.1"
rand = "0.8"
#tcod = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
imgui = { version = "0.12.0", optional = true }
imgui-sys = { version = "0.12.0", optional = true }
ringbuf = { version = "0.4.7", optional = true }

[features]
imgui = ["raylib/imgui", "dep:imgui", "dep:imgui-sys"]
ringbuf = ["dep:ringbuf"]
sdl = ["raylib/sdl"]
software_render = ["raylib/software_render"]
platform_memory = ["raylib/platform_memory"]
platform_web_rgfw = ["raylib/platform_web_rgfw"]

[[bin]]
name = "rgui"
path = "./rgui.rs"

[[bin]]
name = "arkanoid"
path = "./arkanoid.rs"

[[bin]]
name = "logo"
path = "./logo.rs"

[[bin]]
name = "camera_2d"
path = "./camera_2d.rs"

[[bin]]
name = "raymarch"
path = "./raymarch.rs"

[[bin]]
name = "font"
path = "./font.rs"

[[bin]]
name = "drop"
path = "./drop.rs"

[[bin]]
name = "texture"
path = "./texture.rs"


[[bin]]
name = "yaw_pitch_roll"
path = "yaw_pitch_roll.rs"

[[bin]]
name = "input"
path = "input.rs"

[[bin]]
name = "3d_camera_first_person"
path = "3d_camera_first_person.rs"

[[bin]]
name = "model_shader"
path = "model_shader.rs"

[[bin]]
name = "extensions"
path = "extensions.rs"

[[bin]]
name = "asteroids"
path = "./asteroids.rs"

[[bin]]
name = "floppy"
path = "./floppy.rs"

[[bin]]
name = "shader_multisample"
path = "./shader_multisample.rs"

[[bin]]
name = "music_effects"
path = "music_effects.rs"
required-features = ["ringbuf"]

[[bin]]
name = "snake"
path = "snake.rs"
