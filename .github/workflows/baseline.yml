name: baseline

on:
  push:
    branches: [6.0-rc]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  build-sys:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        # raylib builds its own bundled GLFW (USE_EXTERNAL_GLFW=OFF, GLFW_BUILD_X11=ON),
        # so the full X11 dev cluster is required, not just libglfw3-dev.
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y cmake libasound2-dev libudev-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: brew install cmake
      # Windows runners ship cmake + MSVC; no extra deps needed.
      - name: Build raylib-sys
        run: cargo build -p raylib-sys

  build-safe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y cmake libasound2-dev libudev-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: brew install cmake
      - name: Build safe crate
        run: cargo build -p raylib
      # Unit + doc tests are window-independent (no InitWindow); window-opening
      # integration tests run under xvfb in WS6.
      - name: Unit + doc tests
        run: cargo test -p raylib && cargo test -p raylib --doc
      # default-features=false drops raylib's window backend. On Linux, raylib's
      # CMake refuses to build GLFW with both X11 and Wayland disabled, so a
      # backend feature must be re-enabled; Windows/macOS don't use GLFW X11.
      - name: Default-features-off build (non-Linux)
        if: runner.os != 'Linux'
        run: cargo build -p raylib --no-default-features
      - name: Default-features-off build (Linux re-adds an X11 backend)
        if: runner.os == 'Linux'
        run: cargo build -p raylib --no-default-features --features GLFW_BUILD_X11
      - name: All-math-features build
        run: cargo build -p raylib --features glam,mint,serde

  software-render:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y cmake libasound2-dev libudev-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: brew install cmake
      # rlsw + windowless Memory platform: no GPU/display needed.
      - name: Build (software_renderer)
        run: cargo build -p raylib --no-default-features --features software_renderer
      - name: Headless smoke test
        run: cargo test -p raylib-sys --no-default-features --features software_renderer,SUPPORT_MODULE_RTEXTURES --test software_renderer_smoke
      # Tier-2 pixel-probe render tests through the safe-crate harness. The safe
      # `raylib` crate compiles all five SUPPORT_MODULE_* modules, so the test
      # binary references rshapes/rtextures/rtext/rmodels/raudio symbols and they
      # must all be enabled or it fails to link (notably on the MSVC linker).
      # SUPPORT_IMAGE_GENERATION is required because texture.rs exposes
      # gen_image_perlin_noise / gen_image_text unconditionally in Rust; without
      # this flag the C symbols are omitted from raylib.lib and the MSVC linker
      # errors on LNK2019 (GNU/Mach-O linkers are more permissive with dead code).
      - name: Tier-2 headless render tests
        run: cargo test -p raylib --no-default-features --features software_renderer,SUPPORT_MODULE_RTEXTURES,SUPPORT_MODULE_RSHAPES,SUPPORT_MODULE_RTEXT,SUPPORT_MODULE_RMODELS,SUPPORT_MODULE_RAUDIO,SUPPORT_IMAGE_GENERATION --test render_shapes --test render_text -- --test-threads=1
