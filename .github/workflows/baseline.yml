name: baseline

on:
  push:
    branches: [6.0-rc]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  build-sys:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        # raylib builds its own bundled GLFW (USE_EXTERNAL_GLFW=OFF, GLFW_BUILD_X11=ON),
        # so the full X11 dev cluster is required, not just libglfw3-dev.
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y cmake libasound2-dev libudev-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: brew install cmake
      # Windows runners ship cmake + MSVC; no extra deps needed.
      - name: Build raylib-sys
        run: cargo build -p raylib-sys

  build-safe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y cmake libasound2-dev libudev-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: brew install cmake
      - name: Build safe crate
        run: cargo build -p raylib
      # Unit + doc tests are window-independent (no InitWindow); window-opening
      # integration tests run under xvfb in WS6.
      - name: Unit + doc tests
        run: cargo test -p raylib && cargo test -p raylib --doc
      - name: Default-features-off build
        run: cargo build -p raylib --no-default-features
      - name: All-math-features build
        run: cargo build -p raylib --features glam,mint,serde
