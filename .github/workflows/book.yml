name: book

on:
  push:
    branches: [6.0-rc, unstable, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake \
            libglfw3-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Set up mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.3'   # pinned after first green run (was 'latest')

      - name: Build raylib (debug; needed by mdbook test for doctest linking)
        run: cargo build -p raylib --features full

      - name: Build the book
        run: mdbook build book

      - name: Run book doctests
        run: |
          # mdbook test -L wires rustdoc to target/debug/deps, but rustdoc needs
          # --extern raylib=<rlib> to resolve the crate by name. Because mdbook test
          # does not support -- passthrough to rustdoc, we call rustdoc --test directly
          # on quickstart.md (the one chapter with a compile-checked Rust block).
          # All other chapters either have no Rust blocks or use ```text fences.
          RAYLIB_RLIB=$(ls target/debug/deps/libraylib-*.rlib | head -1)
          test -n "$RAYLIB_RLIB" || { echo "libraylib rlib not found in target/debug/deps; did the build step run?" >&2; exit 1; }
          rustdoc --test book/src/getting-started/quickstart.md \
            -L target/debug/deps \
            --extern "raylib=$RAYLIB_RLIB" \
            --edition 2024
