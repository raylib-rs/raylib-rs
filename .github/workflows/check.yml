name: check

on:
  push:
    branches: [6.0-rc]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    # sccache + rust-cache interaction: cargo records the wrapper in incremental
    # metadata, which can cause false cache misses. Disable incremental in CI —
    # it rarely helps clean-build CI anyway.
    env:
      CARGO_INCREMENTAL: 0
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y cmake libasound2-dev libudev-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - run: rustup component add clippy
      - uses: mozilla-actions/sccache-action@v0.0.6
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: check-clippy
      - name: Clippy (full, lib + bins)
        run: cargo clippy -p raylib --lib --bins --features full -- -D warnings
      - name: Clippy raylib-sys (full)
        run: cargo clippy -p raylib-sys --features full -- -D warnings
      - name: Clippy (software_renderer tests)
        run: cargo clippy -p raylib --tests --no-default-features --features software_renderer,SUPPORT_MODULE_RTEXTURES,SUPPORT_MODULE_RSHAPES,SUPPORT_MODULE_RTEXT,SUPPORT_MODULE_RMODELS,SUPPORT_MODULE_RAUDIO,SUPPORT_IMAGE_GENERATION,raygui -- -D warnings

  docs:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y cmake libasound2-dev libudev-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - uses: mozilla-actions/sccache-action@v0.0.6
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: check-docs
      # #![deny(missing_docs)] fails the build on any undocumented public item;
      # RUSTDOCFLAGS=-Dwarnings additionally catches broken intra-doc links.
      - name: Doc build (deny missing_docs + broken links)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p raylib --no-deps --features full
      - name: Doctests
        run: cargo test -p raylib --doc --features full

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  msrv:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y cmake libasound2-dev libudev-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: mozilla-actions/sccache-action@v0.0.6
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: check-msrv
      - name: Build on MSRV
        run: cargo +1.85.0 build -p raylib -p raylib-sys --features full
