name: test

on:
  push:
    branches: [6.0-rc, unstable]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # sccache + rust-cache interaction: disable incremental in CI to avoid
  # false misses caused by the rustc-wrapper showing up in incremental metadata.
  # TODO(re-enable): GHA artifact-cache outage 2026-06-02 — sccache disabled until cache recovers
  # CARGO_INCREMENTAL: 0
  # SCCACHE_GHA_ENABLED: "true"
  # RUSTC_WRAPPER: sccache
  # CMAKE_C_COMPILER_LAUNCHER: sccache
  # CMAKE_CXX_COMPILER_LAUNCHER: sccache

jobs:
  # default + full feature sets: build + unit + doctests on all three OSes.
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features: ["default", "full"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y cmake libasound2-dev libudev-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: brew install cmake
      # - uses: mozilla-actions/sccache-action@v0.0.6  # TODO(re-enable): GHA artifact-cache outage 2026-06-02
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Separate cache per feature set — default and full have meaningfully
          # different target dirs, sharing one cache thrashes both.
          shared-key: test-unit-${{ matrix.features }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Build
        run: cargo build -p raylib --features ${{ matrix.features }}
      - name: Unit tests (nextest)
        run: cargo nextest run -p raylib --features ${{ matrix.features }}
      - name: Doc tests
        run: cargo test -p raylib --doc --features ${{ matrix.features }}

  # no-default-features: build-only (no window backend).
  no-default:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y cmake libasound2-dev libudev-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: brew install cmake
      # - uses: mozilla-actions/sccache-action@v0.0.6  # TODO(re-enable): GHA artifact-cache outage 2026-06-02
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-no-default
      - name: Build (non-Linux)
        if: runner.os != 'Linux'
        run: cargo build -p raylib --no-default-features
      - name: Build (Linux re-adds X11 backend)
        if: runner.os == 'Linux'
        run: cargo build -p raylib --no-default-features --features GLFW_BUILD_X11

  # Tier-2 headless render tests via rlsw + Memory platform (no GPU/window).
  software-render:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y cmake libasound2-dev libudev-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: brew install cmake
      # - uses: mozilla-actions/sccache-action@v0.0.6  # TODO(re-enable): GHA artifact-cache outage 2026-06-02
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-software-render
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Build (software_renderer)
        run: cargo build -p raylib --no-default-features --features software_renderer
      - name: Headless smoke test
        run: cargo test -p raylib-sys --no-default-features --features software_renderer,SUPPORT_MODULE_RTEXTURES --test software_renderer_smoke
      - name: Tier-2 render tests (shapes/text)
        run: cargo nextest run -p raylib --no-default-features --features software_renderer,SUPPORT_MODULE_RTEXTURES,SUPPORT_MODULE_RSHAPES,SUPPORT_MODULE_RTEXT,SUPPORT_MODULE_RMODELS,SUPPORT_MODULE_RAUDIO,SUPPORT_IMAGE_GENERATION,SUPPORT_MESH_GENERATION -E 'binary(render_shapes) + binary(render_text)'
      - name: Tier-2 render tests (raygui)
        run: cargo nextest run -p raylib --no-default-features --features software_renderer,SUPPORT_MODULE_RTEXTURES,SUPPORT_MODULE_RSHAPES,SUPPORT_MODULE_RTEXT,SUPPORT_MODULE_RMODELS,SUPPORT_MODULE_RAUDIO,SUPPORT_IMAGE_GENERATION,SUPPORT_MESH_GENERATION,raygui -E 'binary(render_gui) + binary(integration_rgui_icons)'
      - name: Tier-2 render tests (rlgl)
        run: cargo nextest run -p raylib --no-default-features --features software_renderer,SUPPORT_MODULE_RTEXTURES,SUPPORT_MODULE_RSHAPES,SUPPORT_MODULE_RTEXT,SUPPORT_MODULE_RMODELS,SUPPORT_MODULE_RAUDIO,SUPPORT_IMAGE_GENERATION,SUPPORT_MESH_GENERATION -E 'binary(render_rlgl)'
      - name: Tier-2 log-bridge test
        run: cargo nextest run -p raylib --no-default-features --features software_renderer,SUPPORT_MODULE_RTEXTURES,SUPPORT_MODULE_RSHAPES,SUPPORT_MODULE_RTEXT,SUPPORT_MODULE_RMODELS,SUPPORT_MODULE_RAUDIO,SUPPORT_IMAGE_GENERATION,SUPPORT_MESH_GENERATION,log,SUPPORT_TRACELOG -E 'binary(integration_log_bridge)'
      - name: Tier-2 integration tests (raylib-test salvage)
        # The 6 integration_* files preserve coverage salvaged from the
        # retired raylib-test crate. See docs/superpowers/notes/
        # spike-raylib-test-delete-or-fix.md for context. With cargo
        # nextest run, per-test process isolation handles InitWindow's
        # single-init constraint without needing --test-threads=1.
        run: cargo nextest run -p raylib --no-default-features --features software_renderer,SUPPORT_MODULE_RTEXTURES,SUPPORT_MODULE_RSHAPES,SUPPORT_MODULE_RTEXT,SUPPORT_MODULE_RMODELS,SUPPORT_MODULE_RAUDIO,SUPPORT_IMAGE_GENERATION,SUPPORT_FILEFORMAT_TTF,SUPPORT_FILEFORMAT_OBJ,SUPPORT_MESH_GENERATION -E 'binary(integration_window_api) + binary(integration_image_io) + binary(integration_random_seed) + binary(integration_fonts) + binary(integration_models) + binary(integration_model_animations)'
      # TODO(rustdoc-rewrite): Re-enable the "Doctests (software_renderer)"
      # leg before workstream "done" (spec §1 Goal 2). Enabling it now
      # surfaces pre-existing breakage in core::data::compress_data /
      # decompress_data / databuf::DataBuf (CompressionFailed — likely a
      # SUPPORT_COMPRESSION_API gate) and core::window::get_monitor_info
      # (SIGABRT / munmap_chunk invalid pointer under rlsw). These are out
      # of scope for Task 1's "switch the runner" change; tracked-deferred
      # entry to be captured in docs/superpowers/notes/ws-rustdoc-rewrite-
      # complete.md when the workstream closes.
      # - name: Doctests (software_renderer)
      #   run: cargo test -p raylib --doc --no-default-features --features software_renderer,SUPPORT_MODULE_RTEXTURES,SUPPORT_MODULE_RSHAPES,SUPPORT_MODULE_RTEXT,SUPPORT_MODULE_RMODELS,SUPPORT_MODULE_RAUDIO,SUPPORT_IMAGE_GENERATION,SUPPORT_MESH_GENERATION,SUPPORT_FILEFORMAT_TTF

  # Proves the `nobuild` feature links + runs against the PREBUILT raylib 6.0
  # release libraries (not the vendored cmake build). nobuild's link() emits only
  # `dylib=raylib`, so the link-search path and the runtime loader path are
  # supplied here from the downloaded archive. Tier-2 headless is impossible
  # against stock prebuilt raylib (release archives have no Memory/rlsw
  # platform), so this runs only the window-independent raylib-sys tests, which
  # exercise the raymath shim symbols nobuild must provide (raymath_wrappers)
  # plus a link-presence guard for raylib's exported fns (symbol_presence).
  # ADDED, non-required: deliberately not wired into the unstable branch ruleset.
  nobuild-prebuilt:
    name: nobuild-prebuilt (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          # nobuild still runs bindgen against the vendored headers (-Iraylib/src).
          submodules: recursive
      # The prebuilt libraylib.so is dynamically loaded at process start (we link
      # dylib=raylib), so its own deps (X11/GL/ALSA) must be present even though
      # the tests only call raymath/shim symbols. No cmake — nobuild skips it.
      - name: Install Linux runtime deps for prebuilt libraylib.so
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-nobuild-prebuilt-${{ matrix.os }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Download prebuilt raylib 6.0 (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL --retry 5 --retry-all-errors --retry-delay 5 -o raylib.tar.gz https://github.com/raysan5/raylib/releases/download/6.0/raylib-6.0_linux_amd64.tar.gz
          mkdir -p "$RUNNER_TEMP/raylib"
          tar -xzf raylib.tar.gz --strip-components=1 -C "$RUNNER_TEMP/raylib"
          echo "::group::extracted lib dir"
          ls -R "$RUNNER_TEMP/raylib/lib"
          echo "::endgroup::"
      - name: Run window-independent tests against the prebuilt dylib (Linux)
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: "-L native=${{ runner.temp }}/raylib/lib"
          LD_LIBRARY_PATH: "${{ runner.temp }}/raylib/lib"
        run: cargo nextest run -p raylib-sys --no-default-features --features nobuild -E 'binary(raymath_wrappers) + binary(symbol_presence)'
      - name: Download prebuilt raylib 6.0 (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -sSL --retry 5 --retry-all-errors --retry-delay 5 -o raylib.tar.gz https://github.com/raysan5/raylib/releases/download/6.0/raylib-6.0_macos.tar.gz
          mkdir -p "$RUNNER_TEMP/raylib"
          tar -xzf raylib.tar.gz --strip-components=1 -C "$RUNNER_TEMP/raylib"
          echo "::group::extracted lib dir"
          ls -R "$RUNNER_TEMP/raylib/lib"
          echo "::endgroup::"
      # Belt-and-suspenders for dyld: bake an rpath into the test binaries AND set
      # DYLD_LIBRARY_PATH, since macOS strips DYLD_* in some spawn paths and the
      # prebuilt dylib's install_name may or may not be @rpath-relative.
      - name: Run window-independent tests against the prebuilt dylib (macOS)
        if: runner.os == 'macOS'
        env:
          RUSTFLAGS: "-L native=${{ runner.temp }}/raylib/lib -C link-arg=-Wl,-rpath,${{ runner.temp }}/raylib/lib"
          DYLD_LIBRARY_PATH: "${{ runner.temp }}/raylib/lib"
        run: cargo nextest run -p raylib-sys --no-default-features --features nobuild -E 'binary(raymath_wrappers) + binary(symbol_presence)'
      - name: Download prebuilt raylib 6.0 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # curl.exe (built into windows-latest) has --retry; Invoke-WebRequest
          # does not, and the GitHub release CDN intermittently 504s.
          curl.exe -sSL --retry 5 --retry-all-errors --retry-delay 5 -o raylib.zip https://github.com/raysan5/raylib/releases/download/6.0/raylib-6.0_win64_msvc16.zip
          Expand-Archive raylib.zip -DestinationPath "$env:RUNNER_TEMP/raylib_extract" -Force
          $root = (Get-ChildItem "$env:RUNNER_TEMP/raylib_extract" -Directory | Select-Object -First 1).FullName
          # Link dynamically via the DLL import lib: the `dylib=raylib` directive
          # resolves `raylib.lib`, so overwrite it with `raylibdll.lib`. The static
          # raylib.lib would instead pull rcore.obj -> winmm/user32/gdi32 symbols
          # that nobuild's link() does not emit. raylib.dll goes on PATH at runtime.
          Copy-Item "$root/lib/raylibdll.lib" "$root/lib/raylib.lib" -Force
          "RAYLIB_PREBUILT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "lib dir:"; Get-ChildItem "$root/lib" | Select-Object Name
      - name: Run window-independent tests against the prebuilt dll (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUSTFLAGS: "-L native=${{ env.RAYLIB_PREBUILT }}/lib"
        run: |
          $env:PATH = "$env:RAYLIB_PREBUILT/lib;" + $env:PATH
          cargo nextest run -p raylib-sys --no-default-features --features nobuild -E 'binary(raymath_wrappers) + binary(symbol_presence)'
