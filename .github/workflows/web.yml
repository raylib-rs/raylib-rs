name: web

on:
  push:
    branches: [6.0-rc]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Required by raylib-sys/build.rs for the emscripten target (it panics without it).
  EMCC_CFLAGS: "-O3 -sUSE_GLFW=3 -sASSERTIONS=1 -sWASM=1 -sASYNCIFY -sGL_ENABLE_GET_PROC_ADDRESS=1"
  # sccache + rust-cache interaction: disable incremental in CI to avoid
  # false misses caused by the rustc-wrapper showing up in incremental metadata.
  CARGO_INCREMENTAL: 0
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  CMAKE_C_COMPILER_LAUNCHER: sccache
  CMAKE_CXX_COMPILER_LAUNCHER: sccache

jobs:
  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y cmake
      - name: Set up emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache
      - name: Verify emcc on PATH
        run: emcc --version
      - name: Export bindgen sysroot for wasm32-emscripten
        # bindgen uses host clang; without this it finds /usr/include/math.h (glibc) instead
        # of the emscripten wasm sysroot, causing a fatal 'bits/libc-header-start.h' not found error.
        run: echo "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=$EMSDK/upstream/emscripten/cache/sysroot" >> $GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
      - uses: mozilla-actions/sccache-action@v0.0.6
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: web-wasm
      - name: Build raylib-sys (wasm)
        run: cargo build -p raylib-sys --target wasm32-unknown-emscripten
      - name: Build raylib (wasm)
        run: cargo build -p raylib --target wasm32-unknown-emscripten
      # NOTE: software_renderer (Platform::Memory/rlsw) is a CPU-only headless path
      # for desktop testing; it is mutually incompatible with wasm32-unknown-emscripten
      # (platform_from_target returns Memory before the wasm check, so the cc-compiled
      # C shims are built as native x86 objects and the bindgen sysroot is wrong).
      # Headless wasm CI tests are not meaningful — wasm uses WebGL (GLES2), not rlsw.
