name: CI

on:
  merge_group:
  pull_request:
  push:
    branches:
      - unstable-*

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  # If nightly is breaking CI, modify this variable to target a specific nightly version.
  NIGHTLY_TOOLCHAIN: nightly
  RUSTFLAGS: "-D warnings"

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: ${{github.event_name == 'pull_request'}}

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-build-stable-${{ hashFiles('**/Cargo.toml') }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup git submodules
        run: git submodule init; git submodule update
      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps
      - name: Build & run tests
        # Run tests
        run: cargo test -p raylib
        env:
          RUSTFLAGS: "-C debuginfo=0 -D warnings"

  check-compiles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Setup git submodules
        run: git submodule init; git submodule update
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-check-compiles-${{ hashFiles('**/Cargo.toml') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps
      - name: Check Compile
        # See tools/ci/src/main.rs for the commands this runs
        run: cargo build -p raylib
        
  check-compiles-no-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    # TODO(re-enable): no_std smoke test, disabled for the 6.0 publish path.
    #
    # The job builds the safe `raylib` crate for `x86_64-unknown-none` (a
    # bare-metal Tier 3 target with no `std`). `--features nobuild` is just
    # the C-build escape hatch — it skips raylib-sys's cmake step so the C
    # source doesn't try (and fail) to link on a target with no libc; the
    # actual signal under test is whether the Rust side compiles without
    # `std`.
    #
    # Current blockers:
    #   - `thiserror` is added as a runtime dep in 6.0 and is `std`-by-default;
    #     `default-features = false` would help but isn't enough on its own.
    #   - `raylib`'s safe crate uses `std::path` / `std::fs` directly across
    #     file/text/window modules — those would need cfg-gating or moving
    #     to `alloc` / `core` equivalents.
    #   - raylib-sys's `nobuild`+`x86_64-unknown-none` link path itself isn't
    #     wired (no docs on what library file the user is expected to drop
    #     in for a bare-metal build).
    #
    # PR #251 ("Port raylib-sys to work with #![no_std] environments") is the
    # related community work. Tracked-deferred as the post-6.0 "nobuild CI
    # matrix + no_std" workstream.
    if: false
    steps:
      - uses: actions/checkout@v4
      - name: Setup git submodules
        run: git submodule init; git submodule update
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-check-compiles-no-std-${{ hashFiles('**/Cargo.toml') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps
      - name: Check Compile
        run: cargo build -p raylib --no-default-features --features nobuild --target x86_64-unknown-none
  
  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check for typos
        uses: crate-ci/typos@v1.30.2
      - name: Typos info
        if: failure()
        run: |
          echo 'To fix typos, please run `typos -w`'
          echo 'To check for a diff, run `typos`'
          echo 'You can find typos here: https://crates.io/crates/typos'
          echo 'if you use VSCode, you can also install `Typos Spell Checker'
          echo 'You can find the extension here: https://marketplace.visualstudio.com/items?itemName=tekumara.typos-vscode'

  check-doc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup git submodules
        run: git submodule init; git submodule update
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-check-doc-${{ hashFiles('**/Cargo.toml') }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps
        with:
          wayland: true
          xkb: true
      - name: Build and check doc
        # See tools/ci/src/main.rs for the commands this runs
        run: cargo doc -p raylib
        env:
          RUSTFLAGS: "-C debuginfo=0 -D warnings"
      # This currently report a lot of false positives
      # Enable it again once it's fixed - https://github.com/bevyengine/bevy/issues/1983
      # - name: Installs cargo-deadlinks
      #   run: cargo install --force cargo-deadlinks
      # - name: Checks dead links
      #   run: cargo deadlinks --dir target/doc/bevy
      #   continue-on-error: true

