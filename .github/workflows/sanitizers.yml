name: sanitizers

on:
  push:
    branches: [6.0-rc]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  asan-ubsan:
    runs-on: ubuntu-latest
    # Informational only (decision D8): the C is sanitized via ENABLE_ASAN/UBSAN +
    # Rust via -Zsanitizer. Miri can't cross FFI, so this is the closest we get to
    # memory-checking the FFI boundary. Never gates the matrix.
    # Runs the ModelAnimations RAII test (raylib/tests/integration_model_animations.rs)
    # under ASAN/UBSAN to validate ModelAnimations::Drop doesn't double-free the heap
    # array allocated by LoadModelAnimations. Also exercises the FFI-heavy
    # software_renderer render tests for broader coverage.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y cmake libasound2-dev libudev-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: x86_64-unknown-linux-gnu
      - name: ASAN — software_renderer render tests
        continue-on-error: true
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          RUSTDOCFLAGS: "-Zsanitizer=address"
          ASAN_OPTIONS: "detect_leaks=0"
        run: >
          cargo +nightly test -p raylib -Z build-std
          --target x86_64-unknown-linux-gnu
          --no-default-features
          --features software_renderer,SUPPORT_MODULE_RTEXTURES,SUPPORT_MODULE_RSHAPES,SUPPORT_MODULE_RTEXT,SUPPORT_MODULE_RMODELS,SUPPORT_MODULE_RAUDIO,SUPPORT_IMAGE_GENERATION,ENABLE_ASAN
          --test render_shapes --test render_text --test integration_model_animations -- --test-threads=1
      - name: UBSAN — software_renderer render tests
        # C side is instrumented via ENABLE_UBSAN (CompilerFlags.cmake:37 adds
        # -fsanitize=undefined). The Rust-side link step needs to pull libubsan
        # so the __ubsan_handle_* symbols resolve — that's what -Clink-arg does
        # below. UBSAN_OPTIONS log_path captures per-process diagnostics for
        # the report step that follows.
        continue-on-error: true
        env:
          RUSTFLAGS: "-Clink-arg=-fsanitize=undefined"
          UBSAN_OPTIONS: "halt_on_error=0:print_stacktrace=1:log_path=ubsan.log"
        run: >
          cargo +nightly test -p raylib -Z build-std
          --target x86_64-unknown-linux-gnu
          --no-default-features
          --features software_renderer,SUPPORT_MODULE_RTEXTURES,SUPPORT_MODULE_RSHAPES,SUPPORT_MODULE_RTEXT,SUPPORT_MODULE_RMODELS,SUPPORT_MODULE_RAUDIO,SUPPORT_IMAGE_GENERATION,ENABLE_UBSAN
          --test render_shapes --test render_text --test integration_model_animations --test integration_ubsan_canary -- --test-threads=1
      - name: UBSAN canary diagnostics (TEMP)
        if: always()
        run: |
          set +e
          echo "=== nm on libubsan_canary.a ==="
          find target -name 'libubsan_canary.a' -exec nm -A {} \; 2>&1 | grep -E "ubsan|canary" | head -50
          echo
          echo "=== ldd on integration_ubsan_canary test binary ==="
          find target -name 'integration_ubsan_canary-*' -type f -executable -exec ldd {} \; 2>&1 | grep -E "ubsan|sanitizer" | head -20
          echo
          echo "=== test binary's UBSAN-related symbols ==="
          find target -name 'integration_ubsan_canary-*' -type f -executable -exec nm -D {} \; 2>&1 | grep -i ubsan | head -20
          echo
          echo "=== ls of working dir for ubsan.log files ==="
          ls -la ubsan.log* 2>&1 || echo "No ubsan.log files"
          echo
          echo "=== try running the test binary directly with UBSAN_OPTIONS visible ==="
          export UBSAN_OPTIONS="halt_on_error=0:print_stacktrace=1:log_to_stderr=1"
          find target -name 'integration_ubsan_canary-*' -type f -executable | head -1 | xargs -r -I {} sh -c 'echo "Running: {}" && {} 2>&1 | head -30'
          echo
          echo "DONE"
      - name: UBSAN findings report
        if: always()
        run: bash ci/ubsan-report.sh
