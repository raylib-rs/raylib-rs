name: showcase

on:
  push:
    branches: [6.0-rc]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # raylib-sys's emscripten target panics in build.rs without this. Matches
  # web.yml's pinned flag set.
  EMCC_CFLAGS: "-O3 -sUSE_GLFW=3 -sASSERTIONS=1 -sWASM=1 -sASYNCIFY -sGL_ENABLE_GET_PROC_ADDRESS=1"
  # Wave 4 closed every raylib core example as a Rust port. Escalate missing
  # pairs from warn-only to fatal so new C examples added upstream get
  # surfaced as a build break, not buried in the diagnostic noise.
  WS9_STRICT_PAIRING: "1"
  # sccache + rust-cache interaction: disable incremental in CI to avoid
  # false misses caused by the rustc-wrapper showing up in incremental metadata.
  CARGO_INCREMENTAL: 0
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  CMAKE_C_COMPILER_LAUNCHER: sccache
  CMAKE_CXX_COMPILER_LAUNCHER: sccache

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y cmake libasound2-dev libudev-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: brew install cmake
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: mozilla-actions/sccache-action@v0.0.6
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: showcase-build
      - name: Build examples (default features)
        run: cargo build -p raylib-showcase --examples
      - name: Build examples (raygui)
        run: cargo build -p raylib-showcase --examples --features raygui
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Unit tests
        run: cargo nextest run -p raylib-showcase

  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Linux build deps
        # cmake for raylib's CMake-based build; the X11/audio/GL stack is
        # needed by the native preflight `cargo build --examples` (which
        # populates examples_meta.json) even though the wasm leg itself
        # targets emscripten.
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y cmake libasound2-dev libudev-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Set up emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache
      - name: Verify emcc on PATH
        run: emcc --version
      - name: Export bindgen sysroot for wasm32-emscripten
        run: echo "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=$EMSDK/upstream/emscripten/cache/sysroot" >> $GITHUB_ENV
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32-unknown-emscripten
      - uses: mozilla-actions/sccache-action@v0.0.6
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Wasm and native target dirs differ — keep distinct from build job.
          shared-key: showcase-wasm
      - name: Build showcase examples (release) to populate examples_meta.json
        run: cargo build -p raylib-showcase --release --examples
      - name: Iterate wasm builds across examples
        run: cargo run -p raylib-showcase --release --bin xtask-wasm-build
